version: '3.8'

services:
  oracledb:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-xe2
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=Oracle123
    volumes:
      - oracle-data:/opt/oracle/oradata
      
      - ./init-hr-schema.sql:/opt/oracle/scripts/setup/init-hr-schema.sql

volumes:
  oracle-data: