apiVersion: coherence.oracle.com/v1
kind: Coherence
metadata:
  name: data-cluster
  namespace: coherence
spec:
  image: ghcr.io/oracle/coherence-ce:22.06
  replicas: 2
  coherence:
    storageEnabled: true
    cacheConfig: /custom-config/coherence-cache-config.xml
    
  ports:
    - name: extend
      port: 20000
      
  configMapVolumes:
    - name: cache-config
      mountPath: /custom-config